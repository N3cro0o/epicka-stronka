[package]
name = "web_page_main_canvas"
version = "0.1.0"
edition = "2024"
authors = ["N3cro0o"]

[lib]
name = "web_page_main_canvas_lib"
path = "src/lib.rs"

[[bin]]
name = "web_page_main_canvas_bin"
path = "src/main.rs"

[dependencies]
console_error_panic_hook = "0.1.7"
iced = {version = "0.14.0", default-features = false, features = ["tiny-skia", "webgl", "thread-pool", "fira-sans"]}
wasm-bindgen = "0.2.128"
